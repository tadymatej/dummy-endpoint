<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummy Endpoint</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
        }
        .card {
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h1 {
            margin: 0 0 1rem 0;
            font-size: 2rem;
            color: #333;
        }
        .card p {
            margin: 0;
            font-size: 1.2rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Dummy Endpoint</h1>
        <p>Memory limit: <span id="memoryLimit">Unknown</span></p>
    </div>

    <script>
        // simulace dynamického obsahu, ale jen v JS
        const memoryLimit = "N/A"; // nemáš PHP, takže nemůžeš načíst skutečné limity
        document.getElementById('memoryLimit').textContent = memoryLimit;
    </script>
</body>
</html>
